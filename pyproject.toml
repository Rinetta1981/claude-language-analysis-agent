[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-language-analysis-agent"
version = "0.1.0"
description = "A testable workplace-language analysis agent with deterministic tools, provider abstraction, and optional Claude integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0,<2",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
