name: CI

on:
  push:
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pydantic pytest anthropic

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest -q

      - name: Run frozen mock evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/run_frozen_eval.py

      - name: Score frozen mock evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/score_frozen_eval.py
